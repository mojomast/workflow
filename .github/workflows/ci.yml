name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: reference demo + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the reference demo (ACDD + TDD, default)
        run: python3 reference/run_demo.py --out "$RUNNER_TEMP/acdd-demo"
      - name: Run the legacy reference demo
        run: python3 reference/run_demo.py --legacy
      - name: Check the schemas, the example contract and the demo evidence with jsonschema
        run: |
          python3 -m pip install --quiet "jsonschema==4.23.0"
          python3 reference/check_schemas.py "$RUNNER_TEMP/acdd-demo"
      - name: Run the reference tests
        run: python3 -m unittest discover -s reference/tests -v
      - name: acdd-lint tests
        working-directory: tools/acdd-lint
        run: python3 -m unittest discover -s tests -t . -v
      - name: acdd-lint on the build evidence and the demo's signed output
        working-directory: tools/acdd-lint
        run: |
          python3 -m acdd_lint ../../evidence/2026-11-12-acdd-build
          python3 -m acdd_lint "$RUNNER_TEMP/acdd-demo" --key-file "$RUNNER_TEMP/acdd-demo/keys/verifier.key"
      - name: acdd-lint flags exactly the known stale record in the dogfood evidence
        # L1's first RED was made against the superseded v1 contract; it is kept as history.
        working-directory: tools/acdd-lint
        run: |
          set +e
          python3 -m acdd_lint ../../evidence/2026-11-12-acdd-lint-dogfood --json > "$RUNNER_TEMP/dogfood-lint.json"
          rc=$?
          set -e
          test "$rc" = 1
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); got=[(p['code'],p['file']) for p in d['problems']]; want=[('evidence_stale','evidence/L1-schema/0001-red.json')]; print(got); sys.exit(got!=want)" "$RUNNER_TEMP/dogfood-lint.json"

  project-state:
    name: project-state schemas + reference checker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python3 -m pip install --quiet "jsonschema>=4.18,<5"
      - name: Run the project-state tests (jsonschema required, no skips)
        run: python3 -m unittest discover -s tools/project-state/tests -t tools/project-state -v

  observability:
    name: observability record tests
    # Runs the observability schema, alert-threshold and envelope tests, which
    # the other jobs never ran (independent review, Nov 12). Make it a required
    # check in branch protection.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Observability tests (stdlib only)
        run: python3 -m unittest discover -s observability/tests -t . -v

  acceptance-light:
    name: cold-start acceptance (light, offline worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bubblewrap and allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict unprivileged user namespaces via
        # AppArmor, which makes bwrap unusable. Lift it on this throwaway runner.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Cold start (fresh clones, clean HOME + venv)
        # bundlebees#5 merged as 2f83ae4. Pin that exact commit (not a floating
        # branch) and require ACDD against it. Bump the pin deliberately.
        env:
          ACCEPTANCE_MODE: local
          WORKFLOW_SRC: ${{ github.workspace }}
          BUNDLEBEES_REF: main
          BUNDLEBEES_SHA: 39602ff232cf6dad404a551d8e13f6f29b5d363d
          ACCEPTANCE_ACDD: require
          ACCEPTANCE_PRIOR_INTERVENTIONS: "CI lifted the AppArmor userns restriction::GitHub ubuntu-24.04 runners block unprivileged user namespaces, which bwrap needs"
        run: |
          git checkout -B ci-under-test
          acceptance/cold_start.sh "$RUNNER_TEMP/acceptance-out"
      - name: Show report
        if: always()
        run: cat "$RUNNER_TEMP/acceptance-out/REPORT.md" || true

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner

  feature-packet:
    name: feature packet protocol (required)
    # Validates rizzstack.feature-packet/1 and rizzstack.source-resolution/1.
    # The examples pin a real schema-bearing commit, so the job needs the
    # history (fetch-depth: 0): a shallow clone cannot resolve the pin, and the
    # drift check would have nothing to compare against.
    # Make this job a required check in branch protection.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python3 -m pip install --quiet "jsonschema>=4.18,<5"
      - name: Feature packet protocol tests (required, jsonschema required, no skips)
        run: python3 -m unittest tests.test_feature_packet -v
      - name: Every module under tests/
        run: python3 -m unittest discover -s tests -t . -q

  return-manifest:
    name: return manifest protocol (required)
    # Validates rizzstack.return/1: digest recomputation, the always-pending
    # receiver decision, PASS evidence, descendant consistency and every enum.
    # The examples pin a schema-bearing ancestor, so the job needs the history
    # (fetch-depth: 0) to resolve the pin and compare its bytes.
    # Make this job a required check in branch protection.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python3 -m pip install --quiet "jsonschema>=4.18,<5"
      - name: Return manifest protocol tests (required, jsonschema required, no skips)
        run: python3 -m unittest tests.test_return_manifest -v
      - name: Validate the two examples with the CLI
        run: python3 tools/return_manifest.py schemas/examples/return-exact.json schemas/examples/return-dependent.json
      - name: Every module under tests/
        run: python3 -m unittest discover -s tests -t . -q

  recovery-protocol:
    name: recovery protocol (required)
    # Validates rizzstack.recovery/1: the five failure classes and their
    # evidence, the envelope bounds, retry/supersede/escalation legality,
    # supersession binding, digest binding, the anti-widening rules, and the
    # optional recovery array in the RETURN manifest.
    # The final discover step also runs the return examples' schema pin, so the
    # job needs the history (fetch-depth: 0).
    # Make this job a required check in branch protection.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python3 -m pip install --quiet "jsonschema>=4.18,<5"
      - name: Recovery protocol tests (required, jsonschema required, no skips)
        run: python3 -m unittest tests.test_recovery_protocol -v
      - name: Validate the request and decision examples with the CLI
        run: |
          python3 tools/recovery.py request schemas/examples/recovery-request.json
          python3 tools/recovery.py decision schemas/examples/recovery-decision.json \
            --request schemas/examples/recovery-request.json --attempts-used 1
      - name: Every module under tests/
        run: python3 -m unittest discover -s tests -t . -q
