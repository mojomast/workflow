name: pr-summary-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-summary-build:
    name: pr-summary-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the PR summary comment body
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
          python3 contrib/bee-ci/report/pr_comment.py --root . --changed-files "$RUNNER_TEMP/changed.txt" --pr "$PR_NUMBER" --out "$RUNNER_TEMP/pr-summary"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-summary
          path: ${{ runner.temp }}/pr-summary
          if-no-files-found: ignore
          retention-days: 3
