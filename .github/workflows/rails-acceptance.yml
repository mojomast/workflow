name: Four-repository Rails acceptance

on:
  workflow_dispatch:
    inputs:
      bundlebees_sha:
        description: Reviewed BundleBees commit (40 lowercase hex characters)
        required: true
      hyvv_sha:
        description: Reviewed Hyvv commit
        required: true
      orbitdesktop_sha:
        description: Reviewed Orbit Desktop commit
        required: true

permissions:
  contents: read

jobs:
  rails-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require exact sibling revisions
        env:
          BUNDLEBEES_SHA: ${{ inputs.bundlebees_sha }}
          HYVV_SHA: ${{ inputs.hyvv_sha }}
          ORBIT_SHA: ${{ inputs.orbitdesktop_sha }}
        run: |
          for ref in "$BUNDLEBEES_SHA" "$HYVV_SHA" "$ORBIT_SHA"; do
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full commit SHA'; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mojomast/bundlebees
          ref: ${{ inputs.bundlebees_sha }}
          path: bundlebees
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mojomast/hyvv
          ref: ${{ inputs.hyvv_sha }}
          path: hyvv
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mojomast/orbitdesktop
          ref: ${{ inputs.orbitdesktop_sha }}
          path: orbitdesktop
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1' # match Orbit's native-dependency CI
          package-manager-cache: false
      - name: Install test prerequisites
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          python -m pip install 'jsonschema>=4.18,<5' 'pytest>=8,<9'
          npm ci --prefix orbitdesktop --no-audit --no-fund
      - name: Install matching Chromium and build isolated Orbit shell
        working-directory: orbitdesktop
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers"
          node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
          export ORBIT_BUILD_SCRATCH="$RUNNER_TEMP/rails-build"
          node scripts/isolated_build.mjs --dest "$ORBIT_BUILD_SCRATCH/dist"
          test -s "$ORBIT_BUILD_SCRATCH/dist/index.html"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "RAILS_R18_BROWSER_DIST=$ORBIT_BUILD_SCRATCH/dist" >> "$GITHUB_ENV"
      - name: Run all R18 cases and fail on skips
        working-directory: workflow
        env:
          RAILS_R18_REQUIRED: '1'
        run: |
          export RAILS_R18_EVIDENCE_DIR="$RUNNER_TEMP/r18-read-handoff"
          export RAILS_R18_CAMPAIGN_DIR="$RUNNER_TEMP/r18-campaign-handoff"
          python -m pytest -q tests/test_rails_acceptance.py --junitxml="$RUNNER_TEMP/rails.xml"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          cases = list(ET.parse(os.environ['RUNNER_TEMP'] + '/rails.xml').iter('testcase'))
          if not cases or any(case.find('skipped') is not None for case in cases):
              raise SystemExit('Cross-repository acceptance did not fully execute; check candidate pins and prerequisites.')
          PY
